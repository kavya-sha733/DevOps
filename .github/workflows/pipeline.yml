name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ── Stage 1: Build & Unit Test ─────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Unit Tests with Maven
        run: mvn -B verify --file app/pom.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: app/target/surefire-reports
          retention-days: 7

  # ── Stage 2: Docker Build, Security Gate, and Push ─────────────────────────
  docker-security-and-push:
    name: Docker Build, Scan & Push
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Image Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/self-healing-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      # STEP 1: Build Image locally into runner Docker daemon (load: true, push: false)
      - name: Build Docker Image Locally (Staged for Security Scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # STEP 2: DevSecOps Quality Gate (Trivy Scan will be inserted here in Task 3.2)
      - name: Security Scan Gate (Placeholder for Trivy in Task 3.2)
        run: |
          echo "=========================================================="
          echo "Image successfully built and loaded into local Docker daemon."
          echo "Ready for Trivy vulnerability scanning before publishing."
          echo "=========================================================="
          docker images

      # STEP 3: Push Image to Docker Hub (ONLY after scan passes and NOT on PR)
      - name: Push Docker Image to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

